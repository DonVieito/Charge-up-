name: Build Charge Up 3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - Charge-up-3.0-android
    paths:
      - 'ChargeUp-3.0-Android-alpha2-diagnose.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          mkdir -p android-project
          unzip -q ChargeUp-3.0-Android-alpha2-diagnose.zip -d android-project

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project/ChargeUp-3.0-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ChargeUp-3.0-Android-APK
          path: android-project/ChargeUp-3.0-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
