<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102b24"><meta name="description" content="Charge Up – laadkaart in ontwikkeling"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>Charge Up 1.6 · 3D Navigatiekaart</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Arial,sans-serif;background:#dce7e1}#map{position:absolute;inset:0;width:100%;height:100%;height:100dvh}.maplibregl-map{width:100%;height:100%}.top{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.logo{background:#102b24;color:#fff;border-radius:17px;padding:12px 15px;font-weight:900;box-shadow:0 4px 20px #0003;letter-spacing:.4px}.logo b{color:#66f3a4}.logo small{font-weight:500;opacity:.7}.actions{position:fixed;right:12px;bottom:calc(110px + env(safe-area-inset-bottom));z-index:12;display:grid;gap:10px}button{appearance:none;border:0;border-radius:16px;background:white;color:#123a2a;font-weight:800;font-size:15px;padding:13px 16px;min-height:52px;box-shadow:0 4px 18px #0003;touch-action:manipulation}button.primary{background:#087d50;color:white}.status{position:fixed;z-index:12;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;background:#102b24f2;color:white;padding:14px 16px;border-radius:16px;font-size:13px;line-height:1.4;box-shadow:0 4px 18px #0003;min-height:66px}.status strong{display:block;font-size:14px;margin-bottom:3px}.maplibregl-control-container .maplibregl-ctrl-bottom-right{bottom:85px}.maplibregl-ctrl-attrib{font-size:10px!important}.maplibregl-ctrl-logo{display:none!important}.gps-dot{height:18px;width:18px;background:#1987ff;border:3px solid white;border-radius:50%;box-shadow:0 0 0 4px #1987ff55,0 1px 10px #0006} .error{background:#652d25}.charge-pin{padding:0!important;min-height:42px!important;min-width:42px!important;width:42px;height:42px;touch-action:manipulation;pointer-events:auto;background:#087d50;color:#fff;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:900;box-shadow:0 2px 8px #0005;cursor:pointer}.charge-pin.fast{background:#1356c6}.charge-pin.unknown{background:#61746e}.station-card{position:fixed;z-index:1000;bottom:calc(91px + env(safe-area-inset-bottom));left:12px;right:12px;background:#fff;color:#142b24;border-radius:18px;padding:16px;box-shadow:0 5px 25px #0005;max-height:45vh;overflow:auto}.station-card[hidden]{display:none}.station-card h3{margin:0 30px 7px 0}.station-card p{margin:5px 0;font-size:14px}.station-card a{display:inline-block;margin-top:10px;color:#087d50;font-weight:800}.close-card{float:right;min-height:35px;padding:5px 10px}.badge{font-size:11px;background:#d9f4e4;color:#075235;padding:5px 8px;border-radius:10px}.actions{bottom:calc(110px + env(safe-area-inset-bottom))}.actions button{padding:10px 12px;min-height:46px}.status{min-height:70px}
 .actions{bottom:calc(110px + env(safe-area-inset-bottom))}.actions button{backdrop-filter:blur(8px)}#viewBtn[aria-pressed="true"]{background:#123a2a;color:#fff}.maplibregl-ctrl-attrib{max-width:80vw} .maplibregl-ctrl-attrib a{color:#245e56} </style></head><body><div id="map" aria-label="Interactieve kaart van Nederland"></div><div class="top"><div class="logo">↟ <b>CHARGE</b> UP <small>1.6</small></div></div><div class="actions"><button id="viewBtn" type="button" aria-pressed="false">◩ 3D-weergave</button><button id="searchBtn" type="button">⚡ Zoek laadpunten</button><button id="nlBtn" type="button">🇳🇱 Heel Nederland</button><button class="primary" id="gpsBtn" type="button">◎ Mijn locatie</button></div><section id="stationCard" class="station-card" hidden aria-live="polite"></section><div id="status" class="status" role="status" aria-live="polite"><strong>Kaart laden…</strong>Even geduld.</div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
(()=>{'use strict';
const box=document.getElementById('status');const gpsBtn=document.getElementById('gpsBtn');const nlBtn=document.getElementById('nlBtn');
function msg(title,detail,bad=false){box.classList.toggle('error',bad);box.innerHTML='';const b=document.createElement('strong');b.textContent=title;box.append(b,document.createTextNode(detail));}
const NL=[[3.1,50.7],[7.3,53.65]];const searchBtn=document.getElementById('searchBtn'),stationCard=document.getElementById('stationCard');let stations=[],pins=[],requestToken=0,lastGPS=null;const MAX_PINS=140;const CACHE_TTL=15*60*1000;const CACHE_PREFIX="chargeup:stations:v16:";let activeSearch=null;let map=null,marker=null,accuracyCircle=null,watch=null,firstFix=true,hadTiles=false;let mode3D=true;const viewBtn=document.getElementById('viewBtn');viewBtn.setAttribute('aria-pressed','true');viewBtn.textContent='▤ 2D-weergave';
function reset(){if(!map)return;stationCard.hidden=true;firstFix=false;map.resize();map.fitBounds(NL,{padding:{top:85,bottom:105,left:24,right:24},pitch:mode3D?55:0,bearing:0,duration:550});msg('Nederland in beeld','Tik op Mijn locatie om terug te keren naar jouw omgeving.');}
nlBtn.addEventListener('click',reset);
function gpsError(e){const explanations={1:'Locatietoegang geweigerd. Controleer in Chrome de locatietoestemming voor deze website.',2:'Je telefoon kan momenteel geen positie bepalen.',3:'GPS heeft te lang nodig. Probeer buiten opnieuw.'};msg('GPS niet beschikbaar',explanations[e.code]||e.message||'Onbekende GPS-fout.',true);gpsBtn.textContent='◎ Opnieuw proberen';}
function updateGPS(p){const {latitude,longitude,accuracy}=p.coords;const loc=[longitude,latitude];if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return;
if(!marker){const dot=document.createElement('div');dot.className='gps-dot';marker=new maplibregl.Marker({element:dot,anchor:'center'}).setLngLat(loc).addTo(map);}else marker.setLngLat(loc);
const ring={type:'Feature',properties:{},geometry:{type:'Point',coordinates:loc}};
// Draw accuracy radius in metres as a 64-point GeoJSON polygon.
const pts=[];const latRad=latitude*Math.PI/180;const r=Math.max(1,accuracy);for(let i=0;i<=64;i++){const a=i*Math.PI*2/64;pts.push([longitude+(r*Math.cos(a))/(111320*Math.max(.05,Math.cos(latRad))),latitude+(r*Math.sin(a))/111320]);}
const geo={type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[pts]}};
if(map.getSource('accuracy'))map.getSource('accuracy').setData(geo);
lastGPS={latitude,longitude,accuracy};if(firstFix){map.flyTo({center:loc,zoom:accuracy<=100?13.5:12.5,pitch:mode3D?55:0,bearing:0,speed:1.2});firstFix=false;setTimeout(()=>loadStations(latitude,longitude,25),250);}
msg('Locatie gevonden · ± '+Math.round(accuracy)+' meter',accuracy<=50?'GPS-nauwkeurigheid binnen ons doel van 50 meter.':'De GPS-positie is gevonden; wacht eventueel op een nauwkeurigere meting.');gpsBtn.textContent='◎ Mijn locatie';}
function locate(){if(!map){msg('Kaart nog niet gereed','Wacht tot de kaart is geladen.',true);return;}if(!window.isSecureContext){msg('HTTPS vereist','Open Charge Up via je GitHub Pages-adres, niet als lokaal bestand.',true);return;}if(!navigator.geolocation){msg('Geen GPS beschikbaar','Deze browser ondersteunt geen locatiebepaling.',true);return;}msg('GPS zoeken…','Geef Chrome toestemming voor precieze locatie. Dit kan maximaal 30 seconden duren.');gpsBtn.textContent='◌ Zoeken…';firstFix=true;
if(watch!==null)navigator.geolocation.clearWatch(watch);
watch=navigator.geolocation.watchPosition(updateGPS,gpsError,{enableHighAccuracy:true,maximumAge:0,timeout:30000});}
function clearPins(){pins.forEach(pin=>pin.remove());pins=[];stations=[];}
function escapeText(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showStation(item){const t=item.tags||{},lat=item.lat??item.center?.lat,lon=item.lon??item.center?.lon;
const name=t.name||t.operator||'Laadpunt';const addr=[t['addr:street'],t['addr:housenumber'],t['addr:city']].filter(Boolean).join(' ');
const power=t['socket:ccs:output']||t['socket:type2:output']||t['charging_station:output']||t.capacity||'Niet vermeld';
const plugs=Object.entries(t).filter(([k,v])=>k.startsWith('socket:')&&!k.includes(':output')&&v!=='no').map(([k,v])=>k.replace('socket:','')+': '+v).slice(0,6).join(' · ');
stationCard.innerHTML='<button class="close-card" aria-label="Sluiten" type="button">✕</button><h3>'+escapeText(name)+'</h3><p><span class="badge">OpenStreetMap-locatiegegevens</span></p><p>📍 '+escapeText(addr||'Adres niet opgegeven')+'</p><p>⚡ Vermogen/capaciteit: '+escapeText(power)+'</p><p>🔌 Aansluitingen: '+escapeText(plugs||'Niet vermeld')+'</p><p>Beschikbaarheid: onbekend · Tarief: onbekend</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lon)+'">Route starten ↗</a>';
stationCard.querySelector('button').onclick=()=>stationCard.hidden=true;stationCard.hidden=false;msg('Laadstation geselecteerd',name+' · Bekijk de informatiekaart.');}
function renderStations(items){clearPins();stations=items;for(const item of items){const lat=item.lat??item.center?.lat,lon=item.lon??item.center?.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const t=item.tags||{};const fast=Object.keys(t).some(k=>k.includes('ccs')||k.includes('chademo'));
const el=document.createElement('button');el.type='button';el.className='charge-pin '+(fast?'fast':'');el.textContent='ϟ';el.title=t.name||'Laadstation';el.setAttribute('aria-label','Bekijk laadstation '+(t.name||''));el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();showStation(item);});pins.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map));}}
// Fast-first strategy: show nearby chargers immediately, then expand the search.
// Reuse cached results and share overlapping requests. Cache is not live availability data.
function distanceKm(a,b,c,d){const r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;const q=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(q)));}
function cacheKey(lat,lon,radius){return CACHE_PREFIX+lat.toFixed(2)+":"+lon.toFixed(2)+":"+radius;}
function getCache(key){try{const raw=localStorage.getItem(key);if(!raw)return null;const data=JSON.parse(raw);if(Date.now()-data.at>CACHE_TTL){localStorage.removeItem(key);return null;}return data.items;}catch{return null;}}
function setCache(key,items){try{localStorage.setItem(key,JSON.stringify({at:Date.now(),items}));}catch{/* storage unavailable/full */}}
function uniqueStations(items){const found=new Set();return items.filter(x=>{const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))return false;const id=x.type+":"+x.id;if(found.has(id))return false;found.add(id);return true;}).slice(0,MAX_PINS);}
async function queryOverpass(lat,lon,radiusKm,signal){const radius=Math.min(25000,Math.max(500,Math.round(radiusKm*1000)));const q='[out:json][timeout:18];(node["amenity"="charging_station"](around:'+radius+','+lat+','+lon+');way["amenity"="charging_station"](around:'+radius+','+lat+','+lon+'););out center '+MAX_PINS+';';
const endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'];let error;
for(const endpoint of endpoints){if(signal.aborted)throw new DOMException('Geannuleerd','AbortError');try{const response=await fetch(endpoint+'?data='+encodeURIComponent(q),{signal,cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();return uniqueStations(data.elements||[]);}catch(e){error=e;if(signal.aborted)throw e;}}
throw error||new Error('Geen verbinding');}
async function loadStations(lat,lon,radiusKm=25){if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
const token=++requestToken;if(activeSearch)activeSearch.abort();const controller=new AbortController();activeSearch=controller;
searchBtn.disabled=true;searchBtn.textContent='◌ Laden…';stationCard.hidden=true;
let shown=[];const desired=Math.min(25,Math.max(2,radiusKm));const stages=desired<=5?[desired]:[5,desired];
function display(items,label){if(token!==requestToken)return;shown=uniqueStations([...shown,...items]);renderStations(shown);msg(shown.length+' laadlocaties zichtbaar',label+' · Geen live bezetting of laadpasprijzen.');}
try{for(let i=0;i<stages.length;i++){const radius=stages[i],key=cacheKey(lat,lon,radius);const cached=getCache(key);
if(cached){display(cached,i===0&&stages.length>1?'Opgeslagen punten in de buurt; verder zoeken…':'Opgeslagen resultaten (max. 15 minuten oud)');continue;}
msg(i===0?'Laadpunten dichtbij zoeken…':'Meer laadpunten ophalen…',i===0?'Eerst binnen '+radius+' km.':'De eerste '+shown.length+' punten staan al op de kaart.');
try{const items=await Promise.race([queryOverpass(lat,lon,radius,controller.signal),new Promise((_,reject)=>{const t=setTimeout(()=>reject(new Error('Tijdslimiet')),22000);controller.signal.addEventListener('abort',()=>{clearTimeout(t);reject(new DOMException('Geannuleerd','AbortError'));},{once:true});})]);if(token!==requestToken)return;setCache(key,items);display(items,i===0&&stages.length>1?'Dichtbij geladen; verder zoeken…':'Zoekactie afgerond');}
catch(e){if(controller.signal.aborted)return;if(i===0&&stages.length>1){msg('Dichtbij zoeken vertraagd','We proberen nu het grotere gebied.');continue;}if(shown.length)msg(shown.length+' laadlocaties zichtbaar','Aanvullende laadpunten konden niet worden opgehaald.');else msg('Laadpunten niet geladen','Databron reageert niet. Probeer opnieuw. ('+e.message+')',true);}}
}finally{if(token===requestToken){activeSearch=null;searchBtn.disabled=false;searchBtn.textContent='⚡ Zoek laadpunten';}}}
searchBtn.addEventListener('click',()=>{stationCard.hidden=true;if(lastGPS&&map.getZoom()>=12){const c=map.getCenter();loadStations(c.lat,c.lng,Math.min(25,Math.max(2,Math.round(120/map.getZoom()))));return;}const zoom=map.getZoom();if(zoom<10){msg('Zoom eerst in','Zoom naar een stad of gebruik Mijn locatie. Een landelijke zoekactie is te groot.');return;}const c=map.getCenter();const bounds=map.getBounds();const latSpan=Math.abs(bounds.getNorth()-bounds.getSouth());loadStations(c.lat,c.lng,Math.min(25,Math.max(2,latSpan*60)));});
gpsBtn.addEventListener('click',locate);
viewBtn.addEventListener('click',()=>{if(!map)return;mode3D=!mode3D;viewBtn.setAttribute('aria-pressed',String(mode3D));viewBtn.textContent=mode3D?'▤ 2D-weergave':'◩ 3D-weergave';const zoom=map.getZoom();map.easeTo({pitch:mode3D?55:0,zoom:zoom,duration:750});msg(mode3D?'3D-perspectief aan':'2D-kaart aan',mode3D?'Draai terug naar 2D via de knop. Gebouwen krijgen hoogte waar de kaartdata dit ondersteunt.':'Je kunt de kaart weer recht van boven bekijken.');});
window.addEventListener('error',e=>msg('Appfout',e.message||'Onbekende fout.',true));
if(typeof maplibregl==='undefined'){msg('Kaartbibliotheek niet geladen','Controleer je internetverbinding en vernieuw de pagina.',true);return;}
try{
map=new maplibregl.Map({container:'map',center:[5.35,52.15],zoom:6,renderWorldCopies:false,attributionControl:true,dragRotate:false,pitchWithRotate:false,maxPitch:70,pitch:55,antialias:true,style:'https://tiles.openfreemap.org/styles/liberty'});
// Readability improvements on the existing OpenFreeMap Liberty vector style.
// Only adjust road and road-label paint properties; all map sources remain unchanged.
function enhanceMapStyle(){
 const layers=map.getStyle().layers||[];
 for(const layer of layers){
  const id=String(layer.id||'').toLowerCase();
  const roadLayer=String(layer['source-layer']||'').toLowerCase()==='transportation';
  const roadName=/(road|street|highway|motorway|transport)/.test(id);
  if(layer.type==='line'&&(roadLayer||roadName)){
   const major=/(motorway|trunk|primary|major|highway)/.test(id);
   const minor=/(minor|service|path|track|pedestrian)/.test(id);
   if(/bridge|tunnel|casing|outline/.test(id))continue;
   try{
    if(major){map.setPaintProperty(layer.id,'line-color','#f5d69d');map.setPaintProperty(layer.id,'line-width',['interpolate',['linear'],['zoom'],8,1.3,12,3.5,15,8,18,16]);}
    else if(minor){map.setPaintProperty(layer.id,'line-color','#ffffff');}
   }catch(e){console.warn('Wegstijl overgeslagen:',layer.id,e);}
  }
  if(layer.type==='symbol'&&/(road|street|transport)/.test(id)){
   try{map.setPaintProperty(layer.id,'text-halo-color','#ffffff');map.setPaintProperty(layer.id,'text-halo-width',1.6);map.setPaintProperty(layer.id,'text-halo-blur',0.4);map.setPaintProperty(layer.id,'text-color','#34483f');}catch(e){console.warn('Labelstijl overgeslagen:',layer.id,e);}
  }
 }
}

map.on('load',()=>{try{const style=map.getStyle();try{enhanceMapStyle();}catch(e){console.warn('Kaartstijl:',e);} const vectorSource=Object.entries(style.sources||{}).find(([k,v])=>v.type==='vector' && (k==='openmaptiles'||k==='composite'))?.[0];if(vectorSource){const firstLabel=style.layers.find(l=>l.type==='symbol')?.id;map.addLayer({id:'chargeup-3d-buildings',type:'fill-extrusion',source:vectorSource,'source-layer':'building',minzoom:14,filter:['all',['!=',['get','hide_3d'],true]],paint:{'fill-extrusion-color':'#b8c8c1','fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,15,['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],12]],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],['to-number',['get','min_height']],0],'fill-extrusion-opacity':0.7}},firstLabel);}}catch(e){console.warn('3D-gebouwen niet beschikbaar:',e);}map.addSource('accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'accuracy-fill',type:'fill',source:'accuracy',paint:{'fill-color':'#1987ff','fill-opacity':0.13}});map.addLayer({id:'accuracy-outline',type:'line',source:'accuracy',paint:{'line-color':'#1987ff','line-width':1.5}});reset();msg('Locatie zoeken…','Charge Up opent automatisch jouw omgeving in 3D. Geef zo nodig toestemming voor GPS.');locate();});
map.on('click',e=>{if(!e.originalEvent.target.closest('.maplibregl-marker'))stationCard.hidden=true;});
map.on('idle',()=>{hadTiles=true;});
map.on('error',e=>{console.warn('Kaartbron:',e.error||e);});
window.addEventListener('resize',()=>map.resize());document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>map.resize(),150)});
setTimeout(()=>{if(!hadTiles)msg('Kaartgegevens laden…','Bij een lege kaart: controleer je internet en probeer te vernieuwen.');},9000);
}catch(e){msg('Kaart kon niet starten',e.message||'Controleer of WebGL in Chrome beschikbaar is.',true);}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}
})();
</script></body></html>
