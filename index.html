function gpsError(e){document.getElementById('speedValue').textContent='--';const explanations={1:'Locatietoegang geweigerd. Controleer in Chrome de locatietoestemming voor deze website.',2:'Je telefoon kan momenteel geen positie bepalen.',3:'GPS heeft te lang nodig. Probeer buiten opnieuw.'};msg('GPS niet beschikbaar',explanations[e.code]||e.message||'Onbekende GPS-fout.',true);gpsBtn.textContent='◎ Opnieuw proberen';}
function updateGPS(p){const {latitude,longitude,accuracy}=p.coords;const loc=[longitude,latitude];if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return;
if(!marker){const dot=document.createElement('div');dot.className='gps-dot';marker=new maplibregl.Marker({element:dot,anchor:'center'}).setLngLat(loc).addTo(map);}else marker.setLngLat(loc);

try{localStorage.setItem(LAST_POSITION_KEY,JSON.stringify({lat:latitude,lon:longitude,at:Date.now()}));}catch(e){}

if(!firstFix && lastStationGPS && distanceKm(lastStationGPS.latitude,lastStationGPS.longitude,latitude,longitude)>5){lastStationGPS={latitude,longitude};loadStations(latitude,longitude,25);}
if(activeRoute&&routeSteps.length)updateRouteProgress(loc);msg('Locatie gevonden · ± '+Math.round(accuracy)+' meter',accuracy<=50?'GPS-nauwkeurigheid binnen ons doel van 50 meter.':'De GPS-positie is gevonden; wacht eventueel op een nauwkeurigere meting.');gpsBtn.textContent='◎ Mijn locatie';}
function locate(){if(!map){msg('Kaart nog niet gereed','Wacht tot de kaart is geladen.',true);return;}if(!window.isSecureContext){msg('HTTPS vereist','Open Charge Up via je GitHub Pages-adres, niet als lokaal bestand.',true);return;}if(!navigator.geolocation){msg('Geen GPS beschikbaar','Deze browser ondersteunt geen locatiebepaling.',true);return;}msg('GPS zoeken…','Geef Chrome toestemming voor precieze locatie. Dit kan maximaal 30 seconden duren.');gpsBtn.textContent='◌ Zoeken…';firstFix=true;

function showStation(item){const t=item.tags||{},lat=Number(item.lat??item.center?.lat),lon=Number(item.lon??item.center?.lon);

function renderStations(items){
 // HYPERSPEED: MapLibre WebGL layers instead of thousands of DOM markers.
 stations=items;
 const features=[];
 for(let i=0;i<items.length;i++){
  const item=items[i],lat=Number(item.lat??item.center?.lat),lon=Number(item.lon??item.center?.lon);
  if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;
  const tags=item.tags||{};
  const fast=Object.keys(tags).some(k=>k.includes('ccs')||k.includes('chademo'))||item.fast===true;
  features.push({type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:{idx:i,kind:fast?'DC':'AC'}});
 }
 const source=map&&map.getSource('chargers');
 if(source && chargerLayersReady){
   try {source.setData({type:'FeatureCollection',features});chargerFallback=false;clearFallbackPins();}
   catch(e){diag('Kaartlaag fout: '+e.message);chargerFallback=true;renderFallbackPins(items);}
  } else {chargerFallback=true;renderFallbackPins(items);diag('GPU-laag ontbreekt: reservepunten zichtbaar');}

   // If a map style fails to render the layer, offer a small visible fallback.
   setTimeout(()=>{if(!map||!stations.length||!map.isStyleLoaded())return;
    const layer=map.getLayer('charger-points');
    if(!layer){chargerFallback=true;renderFallbackPins(stations);diag('GPU-laag niet aanwezig: reservepunten getekend');}
   },800);
  }
  diag('Kaartpunten: '+features.length+' van '+items.length+' laadlocaties getekend.');
}

  if(pins.length>=120)break;

}

// Fast-first strategy: show nearby chargers immediately, then expand the search.
// Reuse cached results and share overlapping requests. Cache is not live availability data.
function distanceKm(a,b,c,d){const r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;const q=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(q)));}
function cacheKey(lat,lon,radius){return CACHE_PREFIX+lat.toFixed(2)+":"+lon.toFixed(2)+":"+radius;}
function getCache(key){try{const raw=localStorage.getItem(key);if(!raw)return null;const data=JSON.parse(raw);if(Date.now()-data.at>CACHE_TTL){localStorage.removeItem(key);return null;}return data.items;}catch{return null;}}
function setCache(key,items){try{localStorage.setItem(key,JSON.stringify({at:Date.now(),items}));}catch{/* storage unavailable/full */}}
function uniqueStations(items){const found=new Set();return items.filter(x=>{const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon;if(!Number.isFinite(Number(lat))||!Number.isFinite(Number(lon)))return false;const id=(x.source||x.type||'unknown')+":"+x.id;if(found.has(id))return false;found.add(id);return true;}).slice(0,MAX_PINS);}
async function queryOverpass(lat,lon,radiusKm,signal){const radius=Math.min(25000,Math.max(500,Math.round(radiusKm*1000)));const q='[out:json][timeout:18];(node["amenity"="charging_station"](around:'+radius+','+lat+','+lon+');way["amenity"="charging_station"](around:'+radius+','+lat+','+lon+'););out center '+MAX_PINS+';';
const endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'];let error;
for(const endpoint of endpoints){if(signal.aborted)throw new DOMException('Geannuleerd','AbortError');try{const response=await fetch(endpoint+'?data='+encodeURIComponent(q),{signal,cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();return uniqueStations(data.elements||[]);}catch(e){error=e;if(signal.aborted)throw e;}}
throw error||new Error('Geen verbinding');}
// DOT-NL official GeoJSON consumer endpoint. Fall back to OSM if the browser/API rejects a request.
async function queryDOTNL(lat,lon,radiusKm,signal){
 diag('NDW landelijke dataset: manifest ophalen');
 const response=await fetch('./data/manifest.json?nocache='+Date.now(),{signal,cache:'no-store'});
 if(!response.ok)throw Error('Landelijke dataset nog niet gegenereerd (manifest HTTP '+response.status+'). Start GitHub Actions: Update Nederlandse laadpunten.');
 const manifest=await response.json();
 if(!Array.isArray(manifest.tiles))throw Error('NDW manifest ongeldig');
 const km=Math.max(1,radiusKm),latDelta=km/111.2,lonDelta=km/(111.2*Math.max(.25,Math.cos(lat*Math.PI/180)));
 const minX=Math.floor((lon-lonDelta)*10),maxX=Math.floor((lon+lonDelta)*10),minY=Math.floor((lat-latDelta)*10),maxY=Math.floor((lat+latDelta)*10);
 const available=new Set(manifest.tiles);const keys=[];
 for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){const key=x+'_'+y;if(available.has(key))keys.push(key);}
 diag('NDW dataset '+manifest.total+' landelijke locaties; '+keys.length+' kaartvakken ophalen; update '+manifest.updated);
 const results=await Promise.all(keys.map(async key=>{const r=await fetch('./data/tiles/'+key+'.json',{signal});if(!r.ok)throw Error('Kaartvak '+key+' HTTP '+r.status);return r.json();}));
 const items=results.flat().filter(item=>distanceKm(lat,lon,item.lat,item.lon)<=km);
 diag('NDW geselecteerd: '+items.length+' locaties binnen '+km+' km');
 return uniqueStations(items);
}

async function loadStations(lat,lon,radiusKm=25){if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
dotnlLastError='';const token=++requestToken;if(activeSearch)activeSearch.abort();const controller=new AbortController();activeSearch=controller;
searchBtn.disabled=true;searchBtn.textContent='◌ Laden…';stationCard.hidden=true;
let shown=[];const desired=Math.min(25,Math.max(2,radiusKm));const stages=desired<=5?[desired]:[5,desired];
function display(items,label){if(token!==requestToken)return;shown=uniqueStations([...shown,...items]);renderStations(shown);msg(shown.length+' laadlocaties zichtbaar',label+' · Laadpunten blijven zichtbaar bij zoomen · Live bezetting nog niet beschikbaar.');}
try{for(let i=0;i<stages.length;i++){const radius=stages[i],key=cacheKey(lat,lon,radius);const cached=getCache(key);if(cached)diag('Cache-hit '+radius+' km: '+cached.length+' locaties; netwerk niet aangeroepen.');
if(cached){display(cached,i===0&&stages.length>1?'Opgeslagen punten in de buurt; verder zoeken…':'Opgeslagen resultaten (max. 15 minuten oud)');continue;}
msg(i===0?'Laadpunten dichtbij zoeken…':'Meer laadpunten ophalen…',i===0?'Eerst binnen '+radius+' km.':'De eerste '+shown.length+' punten staan al op de kaart.');
try{let origin='DOT-NL (landelijke dataset)';const items=await Promise.race([(async()=>{try{return await queryDOTNL(lat,lon,radius,controller.signal);}catch(err){if(controller.signal.aborted)throw err;console.warn('NDW dataset niet beschikbaar; OpenStreetMap reservebron',err);dotnlLastError=err?.message||String(err);diag('NDW DATASET MISLUKT: '+(err?.name||'Error')+' · '+dotnlLastError);origin='OpenStreetMap (reservebron)';return queryOverpass(lat,lon,radius,controller.signal);}})(),new Promise((_,reject)=>{const t=setTimeout(()=>reject(new Error('Tijdslimiet')),22000);controller.signal.addEventListener('abort',()=>{clearTimeout(t);reject(new DOMException('Geannuleerd','AbortError'));},{once:true});})]);if(token!==requestToken)return;setCache(key,items);diag('Getoond via '+origin+': '+items.length+' locaties binnen '+radius+' km');display(items,(i===0&&stages.length>1?'Dichtbij geladen; verder zoeken…':'Zoekactie afgerond')+' · Bron: '+origin+(dotnlLastError&&origin.includes('OpenStreetMap')?' · DOT-NL fout: '+dotnlLastError:''));}
catch(e){if(controller.signal.aborted)return;if(i===0&&stages.length>1){msg('Dichtbij zoeken vertraagd','We proberen nu het grotere gebied.');continue;}if(shown.length)msg(shown.length+' laadlocaties zichtbaar','Aanvullende laadpunten konden niet worden opgehaald.');else msg('Laadpunten niet geladen','Databron reageert niet. Probeer opnieuw. ('+e.message+')',true);}}
}finally{if(token===requestToken){activeSearch=null;searchBtn.disabled=false;searchBtn.textContent='⚡ Zoek laadpunten';}}}
searchBtn.addEventListener('click',()=>{stationCard.hidden=true;if(lastGPS&&map.getZoom()>=12){const c=map.getCenter();loadStations(c.lat,c.lng,Math.min(25,Math.max(2,Math.round(120/map.getZoom()))));return;}const zoom=map.getZoom();if(zoom<10){msg('Zoom eerst in','Zoom naar een stad of gebruik Mijn locatie. Een landelijke zoekactie is te groot.');return;}const c=map.getCenter();const bounds=map.getBounds();const latSpan=Math.abs(bounds.getNorth()-bounds.getSouth());loadStations(c.lat,c.lng,Math.min(25,Math.max(2,latSpan*60)));});
// Routeplanner prototype: publieke OSRM-demodienst; niet bedoeld voor productie of veiligheidskritische navigatie.
const routePickBtn=document.getElementById('routePickBtn'),routeStopBtn=document.getElementById('routeStopBtn');
const routePanel=document.getElementById('routePanel'),routeTitle=document.getElementById('routeTitle'),routeDetails=document.getElementById('routeDetails'),routeHint=document.getElementById('routeHint');
let pickingDestination=false,activeRoute=false,routeSteps=[],routeDestination=null,routeController=null;
function routeStatus(title,detail,hint=''){routePanel.hidden=false;routeTitle.textContent=title;routeDetails.textContent=detail;routeHint.textContent=hint;}
function stopRoute(){if(routeController)routeController.abort();activeRoute=false;routeSteps=[];routeDestination=null;pickingDestination=false;routePanel.hidden=true;routePickBtn.textContent='📍 Bestemming kiezen';if(map&&map.getSource('chargeup-route'))map.getSource('chargeup-route').setData({type:'FeatureCollection',features:[]});}
function updateRouteProgress(loc){if(!routeSteps.length)return;const rad=Math.PI/180;let best=Infinity,step=null;for(const x of routeSteps){if(!x.maneuver?.location)continue;const [lng,lat]=x.maneuver.location;const dy=(lat-loc[1])*111.2,dx=(lng-loc[0])*111.2*Math.cos(lat*rad);const km=Math.hypot(dx,dy);if(km<best){best=km;step=x;}}if(step&&best<2){const instruction=(step.maneuver.type==='arrive'?'Bestemming in de buurt':(step.name||'Volgende manoeuvre'));routeHint.textContent='Dichtstbijzijnde routepunt: '+instruction+' · ca. '+Math.round(best*1000)+' m (geen turn-by-turn begeleiding)';}}
async function planRoute(lon,lat,label='Gekozen bestemming'){
 if(!lastGPS){msg('Locatie nodig','Sta locatie toe voordat je een route plant.',true);return;}
 if(routeController)routeController.abort();routeController=new AbortController();pickingDestination=false;routePickBtn.textContent='📍 Bestemming kiezen';routeDestination=[lon,lat];
 routeStatus('Route berekenen…',label,'Een internetverbinding is nodig.');
 const origin=lastGPS.longitude+','+lastGPS.latitude,destination=lon+','+lat;
 try{
 const url='https://router.project-osrm.org/route/v1/driving/'+origin+';'+destination+'?overview=full&geometries=geojson&steps=true';
 const response=await fetch(url,{signal:routeController.signal});if(!response.ok)throw Error('Routeringsdienst '+response.status);
 const json=await response.json();const route=json.routes?.[0];if(!route||!route.geometry)throw Error('Geen autoroute gevonden');
 const geo={type:'Feature',properties:{},geometry:route.geometry};const source=map.getSource('chargeup-route');if(source)source.setData({type:'FeatureCollection',features:[geo]});
 activeRoute=true;routeSteps=route.legs?.flatMap(l=>l.steps||[])||[];
 const km=(route.distance/1000).toFixed(1),min=Math.max(1,Math.round(route.duration/60));
 routeStatus('Navigatie naar '+label,km+' km · circa '+min+' minuten','Proefroute · volg verkeersborden en de actuele situatie.');
 following=true;followBtn.textContent='➤ Volgen aan';followBtn.setAttribute('aria-pressed','true');
 map.easeTo({center:[lastGPS.longitude,lastGPS.latitude],zoom:15.3,pitch:mode3D?58:0,duration:850});stationCard.hidden=true;setMenu(false);
 }catch(e){if(e.name==='AbortError')return;routeStatus('Route niet beschikbaar',String(e.message||e),'Probeer het later opnieuw; de gratis testdienst kan overbelast zijn.');msg('Routeberekening mislukt',String(e.message||e),true);}
}
routePickBtn.addEventListener('click',()=>{pickingDestination=true;setMenu(false);routeStatus('Kies je bestemming','Houd je vinger op een plek op de kaart.','Je kunt ook een laadpunt openen en Route in Charge Up kiezen.');});
routeStopBtn.addEventListener('click',()=>{stopRoute();setMenu(false);msg('Route gestopt','Je kunt opnieuw een bestemming kiezen.');});

gpsBtn.addEventListener('click',()=>{following=true;manualZoom=false;if(lastGPS){map.easeTo({center:[lastGPS.longitude,lastGPS.latitude],zoom:desiredZoom(),pitch:mode3D?55:0,duration:650});lastFollowAt=Date.now();}if(watch===null)locate();msg('Locatie volgen','De kaart volgt je positie en zoomt automatisch bij rijden of stilstaan.');});
zoomBtn.addEventListener('click',()=>{closeView=!closeView;manualZoom=true;setZoomButton();map.easeTo({zoom:desiredZoom(),duration:650});});
setZoomButton();

viewBtn.addEventListener('click',()=>{if(!map)return;mode3D=!mode3D;viewBtn.setAttribute('aria-pressed',String(mode3D));viewBtn.textContent=mode3D?'▤ 2D-weergave':'◩ 3D-weergave';const zoom=map.getZoom();map.easeTo({pitch:mode3D?55:0,zoom:zoom,duration:750});msg(mode3D?'3D-perspectief aan':'2D-kaart aan',mode3D?'Draai terug naar 2D via de knop. Gebouwen krijgen hoogte waar de kaartdata dit ondersteunt.':'Je kunt de kaart weer recht van boven bekijken.');});
window.addEventListener('error',e=>msg('Appfout',e.message||'Onbekende fout.',true));
if(typeof maplibregl==='undefined'){msg('Kaartbibliotheek niet geladen','Controleer je internetverbinding en vernieuw de pagina.',true);return;}
try{
map=new maplibregl.Map({container:'map',center:startupPosition?[startupPosition.lon,startupPosition.lat]:[5.35,52.15],zoom:startupPosition?15.5:6,renderWorldCopies:false,attributionControl:true,dragRotate:false,pitchWithRotate:false,maxPitch:70,pitch:55,antialias:true,style:'https://tiles.openfreemap.org/styles/liberty'});
// Readability improvements on the existing OpenFreeMap Liberty vector style.
// Only adjust road and road-label paint properties; all map sources remain unchanged.
function enhanceMapStyle(){
 const layers=map.getStyle().layers||[];
 for(const layer of layers){
  const id=String(layer.id||'').toLowerCase();
  const roadLayer=String(layer['source-layer']||'').toLowerCase()==='transportation';
  const roadName=/(road|street|highway|motorway|transport)/.test(id);
  if(layer.type==='line'&&(roadLayer||roadName)){
   const major=/(motorway|trunk|primary|major|highway)/.test(id);
   const minor=/(minor|service|path|track|pedestrian)/.test(id);
   if(/bridge|tunnel|casing|outline/.test(id))continue;
   try{
    if(major){map.setPaintProperty(layer.id,'line-color','#f5d69d');map.setPaintProperty(layer.id,'line-width',['interpolate',['linear'],['zoom'],8,1.3,12,3.5,15,8,18,16]);}
    else if(minor){map.setPaintProperty(layer.id,'line-color','#ffffff');}
   }catch(e){console.warn('Wegstijl overgeslagen:',layer.id,e);}
  }
  if(layer.type==='symbol'&&/(road|street|transport)/.test(id)){
   try{map.setPaintProperty(layer.id,'text-halo-color','#ffffff');map.setPaintProperty(layer.id,'text-halo-width',1.6);map.setPaintProperty(layer.id,'text-halo-blur',0.4);map.setPaintProperty(layer.id,'text-color','#34483f');}catch(e){console.warn('Labelstijl overgeslagen:',layer.id,e);}
  }
 }
}

map.on('load',()=>{try{const style=map.getStyle();try{enhanceMapStyle();}catch(e){console.warn('Kaartstijl:',e);} const vectorSource=Object.entries(style.sources||{}).find(([k,v])=>v.type==='vector' && (k==='openmaptiles'||k==='composite'))?.[0];if(vectorSource){const firstLabel=style.layers.find(l=>l.type==='symbol')?.id;map.addLayer({id:'chargeup-3d-buildings',type:'fill-extrusion',source:vectorSource,'source-layer':'building',minzoom:14,filter:['all',['!=',['get','hide_3d'],true]],paint:{'fill-extrusion-color':'#b8c8c1','fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,15,['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],12]],'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],['to-number',['get','min_height']],0],'fill-extrusion-opacity':0.7}},firstLabel);}}catch(e){console.warn('3D-gebouwen niet beschikbaar:',e);}try{initChargerLayers();}catch(err){chargerLayersReady=false;diag('GPU-laadpaallagen konden niet starten: '+(err.message||err));console.error('Charger layers:',err);}
map.addSource('chargeup-route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'chargeup-route-line-outline',type:'line',source:'chargeup-route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#ffffff','line-width':11,'line-opacity':0.92}});map.addLayer({id:'chargeup-route-line',type:'line',source:'chargeup-route',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#1987ff','line-width':7,'line-opacity':0.97}});map.addSource('accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'accuracy-fill',type:'fill',source:'accuracy',paint:{'fill-color':'#1987ff','fill-opacity':0.13}});map.addLayer({id:'accuracy-outline',type:'line',source:'accuracy',paint:{'line-color':'#1987ff','line-width':1.5}});for(const layerId of ['charger-clusters','charger-cluster-count','charger-points','charger-symbol'])if(map.getLayer(layerId))map.moveLayer(layerId);if(!startupPosition)reset();
msg('Locatie zoeken…',startupPosition?'Laatst bekende omgeving wordt getoond; GPS wordt bijgewerkt.':'GPS zoekt je huidige omgeving.');
locate();
if(startupPosition){lastStationGPS={latitude:startupPosition.lat,longitude:startupPosition.lon};setTimeout(()=>{if(!lastGPS)loadStations(startupPosition.lat,startupPosition.lon,25);},150);}});
map.on('contextmenu',e=>{if(pickingDestination){e.preventDefault();planRoute(e.lngLat.lng,e.lngLat.lat,'Gekozen bestemming');}});map.on('dragstart',()=>{following=false;followBtn.textContent='➤ Volgen uit';followBtn.setAttribute('aria-pressed','false');});
map.on('click',e=>{if(pickingDestination){planRoute(e.lngLat.lng,e.lngLat.lat,'Gekozen bestemming');return;}if(!map.queryRenderedFeatures(e.point,{layers:['charger-points','charger-clusters'].filter(id=>map.getLayer(id))}).length&&!e.originalEvent.target?.closest?.('.maplibregl-marker'))stationCard.hidden=true;});
// Automatisch laadpunten ophalen na kaartbeweging; GPS is niet vereist.
// Kleine GPS-verschuivingen veroorzaken geen nieuwe downloads.
let autoTimer=null,autoArea='';
function scheduleAutoStations(){
 if(!map||!map.getSource('chargers'))return;
 // GPS beheert de laadpunten tijdens volgen; kaartbeweging mag die download niet annuleren.
 if(following && (lastGPS||startupPosition))return;
 clearTimeout(autoTimer);
 if(map.getZoom()<10)return; // Landelijk overzicht blijft licht.
 autoTimer=setTimeout(()=>{
  if(!map||map.getZoom()<10)return;
  const c=map.getCenter(),z=map.getZoom();
  const radius=Math.min(25,Math.max(5,Math.round(100/z)));
  const step=radius/180; // circa 3-8 km: vermijd dubbele zoekacties.
  const key=Math.round(c.lat/step)+':'+Math.round(c.lng/step)+':'+radius;
  if(key===autoArea)return;
  autoArea=key;
  loadStations(c.lat,c.lng,radius);
 },700);
}
map.on('moveend',scheduleAutoStations);
map.on('idle',()=>{hadTiles=true;});
map.on('error',e=>{console.warn('Kaartbron:',e.error||e);});
window.addEventListener('resize',()=>map.resize());document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>map.resize(),150)});
setTimeout(()=>{if(!hadTiles)msg('Kaartgegevens laden…','Bij een lege kaart: controleer je internet en probeer te vernieuwen.');},9000);
}catch(e){msg('Kaart kon niet starten',e.message||'Controleer of WebGL in Chrome beschikbaar is.',true);}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}
})();
