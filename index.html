<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102b24"><meta name="description" content="Charge Up – laadkaart in ontwikkeling"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>Charge Up 1.1 · Laadstations</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Arial,sans-serif;background:#dce7e1}#map{position:absolute;inset:0;width:100%;height:100%;height:100dvh}.maplibregl-map{width:100%;height:100%}.top{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.logo{background:#102b24;color:#fff;border-radius:17px;padding:12px 15px;font-weight:900;box-shadow:0 4px 20px #0003;letter-spacing:.4px}.logo b{color:#66f3a4}.logo small{font-weight:500;opacity:.7}.actions{position:fixed;right:12px;bottom:calc(110px + env(safe-area-inset-bottom));z-index:12;display:grid;gap:10px}button{appearance:none;border:0;border-radius:16px;background:white;color:#123a2a;font-weight:800;font-size:15px;padding:13px 16px;min-height:52px;box-shadow:0 4px 18px #0003;touch-action:manipulation}button.primary{background:#087d50;color:white}.status{position:fixed;z-index:12;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;background:#102b24f2;color:white;padding:14px 16px;border-radius:16px;font-size:13px;line-height:1.4;box-shadow:0 4px 18px #0003;min-height:66px}.status strong{display:block;font-size:14px;margin-bottom:3px}.maplibregl-control-container .maplibregl-ctrl-bottom-right{bottom:85px}.maplibregl-ctrl-attrib{font-size:10px!important}.maplibregl-ctrl-logo{display:none!important}.gps-dot{height:18px;width:18px;background:#1987ff;border:3px solid white;border-radius:50%;box-shadow:0 0 0 4px #1987ff55,0 1px 10px #0006} .error{background:#652d25}.charge-pin{padding:0!important;min-height:42px!important;min-width:42px!important;width:42px;height:42px;touch-action:manipulation;pointer-events:auto;background:#087d50;color:#fff;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:900;box-shadow:0 2px 8px #0005;cursor:pointer}.charge-pin.fast{background:#1356c6}.charge-pin.unknown{background:#61746e}.station-card{position:fixed;z-index:1000;bottom:calc(91px + env(safe-area-inset-bottom));left:12px;right:12px;background:#fff;color:#142b24;border-radius:18px;padding:16px;box-shadow:0 5px 25px #0005;max-height:45vh;overflow:auto}.station-card[hidden]{display:none}.station-card h3{margin:0 30px 7px 0}.station-card p{margin:5px 0;font-size:14px}.station-card a{display:inline-block;margin-top:10px;color:#087d50;font-weight:800}.close-card{float:right;min-height:35px;padding:5px 10px}.badge{font-size:11px;background:#d9f4e4;color:#075235;padding:5px 8px;border-radius:10px}.actions{bottom:calc(110px + env(safe-area-inset-bottom))}.actions button{padding:10px 12px;min-height:46px}.status{min-height:70px}
</style></head><body><div id="map" aria-label="Interactieve kaart van Nederland"></div><div class="top"><div class="logo">↟ <b>CHARGE</b> UP <small>1.1</small></div></div><div class="actions"><button id="searchBtn" type="button">⚡ Zoek laadpunten</button><button id="nlBtn" type="button">🇳🇱 Heel Nederland</button><button class="primary" id="gpsBtn" type="button">◎ Mijn locatie</button></div><section id="stationCard" class="station-card" hidden aria-live="polite"></section><div id="status" class="status" role="status" aria-live="polite"><strong>Kaart laden…</strong>Even geduld.</div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
(()=>{'use strict';
const box=document.getElementById('status');const gpsBtn=document.getElementById('gpsBtn');const nlBtn=document.getElementById('nlBtn');
function msg(title,detail,bad=false){box.classList.toggle('error',bad);box.innerHTML='';const b=document.createElement('strong');b.textContent=title;box.append(b,document.createTextNode(detail));}
const NL=[[3.1,50.7],[7.3,53.65]];const searchBtn=document.getElementById('searchBtn'),stationCard=document.getElementById('stationCard');let stations=[],pins=[],requestToken=0,lastGPS=null;const MAX_PINS=140;let map=null,marker=null,accuracyCircle=null,watch=null,firstFix=true,hadTiles=false;
function reset(){if(!map)return;stationCard.hidden=true;firstFix=true;map.resize();map.fitBounds(NL,{padding:{top:85,bottom:105,left:24,right:24},duration:550});msg('Nederland in beeld','Zoom in of tik op Mijn locatie. Zoek laadpunten laadt punten in het zichtbare gebied.');}
nlBtn.addEventListener('click',reset);
function gpsError(e){const explanations={1:'Locatietoegang geweigerd. Controleer in Chrome de locatietoestemming voor deze website.',2:'Je telefoon kan momenteel geen positie bepalen.',3:'GPS heeft te lang nodig. Probeer buiten opnieuw.'};msg('GPS niet beschikbaar',explanations[e.code]||e.message||'Onbekende GPS-fout.',true);gpsBtn.textContent='◎ Opnieuw proberen';}
function updateGPS(p){const {latitude,longitude,accuracy}=p.coords;const loc=[longitude,latitude];if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return;
if(!marker){const dot=document.createElement('div');dot.className='gps-dot';marker=new maplibregl.Marker({element:dot,anchor:'center'}).setLngLat(loc).addTo(map);}else marker.setLngLat(loc);
const ring={type:'Feature',properties:{},geometry:{type:'Point',coordinates:loc}};
// Draw accuracy radius in metres as a 64-point GeoJSON polygon.
const pts=[];const latRad=latitude*Math.PI/180;const r=Math.max(1,accuracy);for(let i=0;i<=64;i++){const a=i*Math.PI*2/64;pts.push([longitude+(r*Math.cos(a))/(111320*Math.max(.05,Math.cos(latRad))),latitude+(r*Math.sin(a))/111320]);}
const geo={type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[pts]}};
if(map.getSource('accuracy'))map.getSource('accuracy').setData(geo);
lastGPS={latitude,longitude,accuracy};if(firstFix){map.flyTo({center:loc,zoom:accuracy<=50?16:14,speed:1.2});firstFix=false;setTimeout(()=>loadStations(latitude,longitude,25),1200);}
msg('Locatie gevonden · ± '+Math.round(accuracy)+' meter',accuracy<=50?'GPS-nauwkeurigheid binnen ons doel van 50 meter.':'De GPS-positie is gevonden; wacht eventueel op een nauwkeurigere meting.');gpsBtn.textContent='◎ Mijn locatie';}
function locate(){if(!map){msg('Kaart nog niet gereed','Wacht tot de kaart is geladen.',true);return;}if(!window.isSecureContext){msg('HTTPS vereist','Open Charge Up via je GitHub Pages-adres, niet als lokaal bestand.',true);return;}if(!navigator.geolocation){msg('Geen GPS beschikbaar','Deze browser ondersteunt geen locatiebepaling.',true);return;}msg('GPS zoeken…','Geef Chrome toestemming voor precieze locatie. Dit kan maximaal 30 seconden duren.');gpsBtn.textContent='◌ Zoeken…';firstFix=true;
if(watch!==null)navigator.geolocation.clearWatch(watch);
watch=navigator.geolocation.watchPosition(updateGPS,gpsError,{enableHighAccuracy:true,maximumAge:0,timeout:30000});}
function clearPins(){pins.forEach(pin=>pin.remove());pins=[];stations=[];}
function escapeText(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showStation(item){const t=item.tags||{},lat=item.lat??item.center?.lat,lon=item.lon??item.center?.lon;
const name=t.name||t.operator||'Laadpunt';const addr=[t['addr:street'],t['addr:housenumber'],t['addr:city']].filter(Boolean).join(' ');
const power=t['socket:ccs:output']||t['socket:type2:output']||t['charging_station:output']||t.capacity||'Niet vermeld';
const plugs=Object.entries(t).filter(([k,v])=>k.startsWith('socket:')&&!k.includes(':output')&&v!=='no').map(([k,v])=>k.replace('socket:','')+': '+v).slice(0,6).join(' · ');
stationCard.innerHTML='<button class="close-card" aria-label="Sluiten" type="button">✕</button><h3>'+escapeText(name)+'</h3><p><span class="badge">OpenStreetMap-locatiegegevens</span></p><p>📍 '+escapeText(addr||'Adres niet opgegeven')+'</p><p>⚡ Vermogen/capaciteit: '+escapeText(power)+'</p><p>🔌 Aansluitingen: '+escapeText(plugs||'Niet vermeld')+'</p><p>Beschikbaarheid: onbekend · Tarief: onbekend</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lon)+'">Route starten ↗</a>';
stationCard.querySelector('button').onclick=()=>stationCard.hidden=true;stationCard.hidden=false;msg('Laadstation geselecteerd',name+' · Bekijk de informatiekaart.');}
function renderStations(items){clearPins();stations=items;for(const item of items){const lat=item.lat??item.center?.lat,lon=item.lon??item.center?.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const t=item.tags||{};const fast=Object.keys(t).some(k=>k.includes('ccs')||k.includes('chademo'));
const el=document.createElement('button');el.type='button';el.className='charge-pin '+(fast?'fast':'');el.textContent='ϟ';el.title=t.name||'Laadstation';el.setAttribute('aria-label','Bekijk laadstation '+(t.name||''));el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();showStation(item);});el.addEventListener('touchend',ev=>{ev.preventDefault();ev.stopPropagation();showStation(item);},{passive:false});pins.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map));}}
async function loadStations(lat,lon,radiusKm=25){if(!Number.isFinite(lat)||!Number.isFinite(lon))return;const token=++requestToken;searchBtn.disabled=true;searchBtn.textContent='◌ Zoeken…';msg('Laadpunten zoeken…','OpenStreetMap-gegevens ophalen. Beschikbaarheid en prijzen zijn nog niet live.');
const radius=Math.min(25000,Math.max(500,Math.round(radiusKm*1000)));
const query='[out:json][timeout:22];(node["amenity"="charging_station"](around:'+radius+','+lat+','+lon+');way["amenity"="charging_station"](around:'+radius+','+lat+','+lon+'););out center '+MAX_PINS+';';
const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),28000);
try{const res=await fetch('https://overpass.kumi.systems/api/interpreter?data='+encodeURIComponent(query),{signal:controller.signal,cache:'no-store'});if(!res.ok)throw new Error('Server antwoordt met '+res.status);const data=await res.json();if(token!==requestToken)return;const items=(data.elements||[]).filter(x=>Number.isFinite(x.lat??x.center?.lat)&&Number.isFinite(x.lon??x.center?.lon)).slice(0,MAX_PINS);renderStations(items);msg(items.length+' laadlocaties gevonden',items.length===MAX_PINS?'Maximum van 140 resultaten bereikt. Zoom verder in voor meer details.':'OpenStreetMap-gegevens · geen live bezetting of laadpasprijzen.');}
catch(e){if(token===requestToken)msg('Laadpunten niet geladen','De openbare databron reageert niet ('+e.message+'). Probeer later opnieuw.',true);}finally{clearTimeout(timeout);if(token===requestToken){searchBtn.disabled=false;searchBtn.textContent='⚡ Zoek laadpunten';}}}
searchBtn.addEventListener('click',()=>{stationCard.hidden=true;if(lastGPS&&map.getZoom()>=12){const c=map.getCenter();loadStations(c.lat,c.lng,Math.min(25,Math.max(2,Math.round(120/map.getZoom()))));return;}const zoom=map.getZoom();if(zoom<10){msg('Zoom eerst in','Zoom naar een stad of gebruik Mijn locatie. Een landelijke zoekactie is te groot.');return;}const c=map.getCenter();const bounds=map.getBounds();const latSpan=Math.abs(bounds.getNorth()-bounds.getSouth());loadStations(c.lat,c.lng,Math.min(25,Math.max(2,latSpan*60)));});
gpsBtn.addEventListener('click',locate);
window.addEventListener('error',e=>msg('Appfout',e.message||'Onbekende fout.',true));
if(typeof maplibregl==='undefined'){msg('Kaartbibliotheek niet geladen','Controleer je internetverbinding en vernieuw de pagina.',true);return;}
try{
map=new maplibregl.Map({container:'map',center:[5.35,52.15],zoom:6,renderWorldCopies:false,attributionControl:true,dragRotate:false,pitchWithRotate:false,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors',maxzoom:19}},layers:[{id:'osm',type:'raster',source:'osm',minzoom:0,maxzoom:22}]}});
map.on('load',()=>{map.addSource('accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'accuracy-fill',type:'fill',source:'accuracy',paint:{'fill-color':'#1987ff','fill-opacity':0.13}});map.addLayer({id:'accuracy-outline',type:'line',source:'accuracy',paint:{'line-color':'#1987ff','line-width':1.5}});reset();});
map.on('click',e=>{if(!e.originalEvent.target.closest('.maplibregl-marker'))stationCard.hidden=true;});
map.on('sourcedata',e=>{if(e.sourceId==='osm'&&e.isSourceLoaded)hadTiles=true;});
map.on('error',e=>{const t=e.error&&e.error.message||'Kaartgegevens niet beschikbaar';msg('Kaartfout',t+' · Controleer je internetverbinding.',true);});
window.addEventListener('resize',()=>map.resize());document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>map.resize(),150)});
setTimeout(()=>{if(!hadTiles)msg('Kaartgegevens laden…','Bij een lege kaart: controleer je internet en probeer te vernieuwen.');},9000);
}catch(e){msg('Kaart kon niet starten',e.message||'Controleer of WebGL in Chrome beschikbaar is.',true);}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}
})();
</script></body></html>
