const statusEl=document.getElementById('status');const bounds=[[50.72,3.22],[53.55,7.22]];let map,marker,circle,watchId=null;function status(t){statusEl.textContent=t}function resetMap(){if(!map)return;map.invalidateSize({pan:false});map.fitBounds(bounds,{padding:[20,20],animate:false});status('Nederland in beeld · tik op Mijn GPS om je locatie te bepalen.')}function locate(){if(!navigator.geolocation){status('GPS wordt niet ondersteund door deze browser.');return}status('GPS-positie bepalen… Sta nauwkeurige locatie toe.');if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{const {latitude,longitude,accuracy}=p.coords;const ll=[latitude,longitude];if(!marker){marker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);circle=L.circle(ll,{radius:accuracy,color:'#1678ff',fillColor:'#1678ff',fillOpacity:.12,weight:1}).addTo(map)}else{marker.setLatLng(ll);circle.setLatLng(ll).setRadius(accuracy)}map.setView(ll,accuracy<=50?17:15,{animate:false});status('GPS gevonden · nauwkeurigheid ± '+Math.round(accuracy)+' meter'+(accuracy>50?' · wacht op betere ontvangst…':''))},e=>status('GPS niet beschikbaar: '+e.message+'. Controleer locatietoestemming en Android-locatie.'),{enableHighAccuracy:true,maximumAge:0,timeout:25000})}if(window.L){map=L.map('map',{zoomControl:true,preferCanvas:true,zoomSnap:0.5,worldCopyJump:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-bijdragers',keepBuffer:4}).on('tileerror',()=>status('Een kaartdeel kon niet laden. Controleer internet en probeer opnieuw.')).addTo(map);resetMap();window.addEventListener('resize',()=>map.invalidateSize({pan:false}));setTimeout(()=>map.invalidateSize({pan:false}),350);status('Kaart gereed · Nederland in beeld. Tik op Mijn GPS om te lokaliseren.')}else status('Kaartbibliotheek niet geladen. Controleer je internetverbinding.');if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
